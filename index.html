<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học ngoại ngữ">
<meta name="theme-color" content="#F1F5F4">
<title>Học đa ngôn ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>:root{--bg:#F1F5F4;--ink:#2F3E46;--mute:#5B6B72;--sage:#5E8B7E;--sage-d:#3F6F62;--sage-l:#CFE3DC;--pink:#E8AEB7;--pink-l:#F6D9DE;--sky:#A7C7E7;--sky-l:#CFE0F3;--line:#E4EDEA;--card:#FFFFFF;--shadow:0 8px 30px rgba(47,62,70,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--sage-d)}
h1,h2,h3,h4{margin:0;font-family:Inter,sans-serif}
p{margin:0}
#app{max-width:1100px;margin:0 auto;padding:14px 20px calc(120px + env(safe-area-inset-bottom))}
.disp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(32px,5vw,44px);line-height:1.1}
.mute{color:var(--mute)}
.sm{font-size:13px}
.b{font-weight:600}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:14px}
/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.back{min-height:44px;padding:0 16px;border-radius:22px;background:#fff;font:600 14px Inter,sans-serif;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);box-shadow:0 4px 16px rgba(47,62,70,.06)}
.crumbs{font-size:14px;color:var(--mute);flex:1;min-width:120px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--sage-d);font-weight:500;text-decoration:none}
.crumbs i{font-style:normal}
.langs{display:flex;gap:4px;padding:4px;background:#fff;border-radius:24px;box-shadow:0 4px 16px rgba(47,62,70,.08)}
.lg{min-height:40px;min-width:46px;border-radius:20px;font:600 14px Inter,sans-serif;color:var(--mute)}
.lg.on{background:var(--sage);color:#fff}
.plus{position:relative;width:44px;height:44px;border-radius:22px;background:var(--pink);display:inline-flex;align-items:center;justify-content:center;font:600 22px Inter,sans-serif;color:var(--ink);text-decoration:none}
.plus b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
/* nav */
.nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:36px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 32px rgba(47,62,70,.14);z-index:20}
.ni{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:clamp(72px,20vw,96px);height:60px;border-radius:28px;text-decoration:none;font-size:12px;font-weight:500;color:var(--mute)}
.ni.on{background:var(--line);color:var(--ink)}
.ni.on svg{stroke:var(--sage-d)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ni em{position:absolute;top:4px;right:14px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:var(--ink);font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* buttons */
.btn{min-height:48px;padding:0 24px;border-radius:24px;background:var(--ink);color:#fff;font:600 15px Inter,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:hover{background:#3F5058}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(47,62,70,.06)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid #A8B5B1}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.lg2{min-height:56px;font-size:17px;padding:0 32px;border-radius:28px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{min-height:44px;padding:0 18px;border-radius:22px;background:#fff;font:600 14px Inter,sans-serif;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(47,62,70,.05)}
.chip.on{background:var(--sage);color:#fff}
.chip.dark.on{background:var(--ink)}
.seg{display:inline-flex;gap:4px;padding:5px;background:#fff;border-radius:28px;box-shadow:0 4px 16px rgba(47,62,70,.06);flex-wrap:wrap}
.seg button{min-height:44px;padding:0 20px;border-radius:22px;font:600 15px Inter,sans-serif}
.seg button.on{background:var(--sage);color:#fff}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#EBF0EE;display:inline-flex;align-items:center}
.tag.sage{background:var(--sage-l)}
.tag.sky{background:var(--sky-l)}
.tag.pink{background:var(--pink-l)}
.tag.warn{background:#FFF1D6}
/* cards */
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.card.dark{background:var(--ink);color:#fff}
.card.dark .mute{color:#B9C8C3}
.card.soft{background:#F8FAF9;box-shadow:none;border:1.5px dashed #A8B5B1}
.tile{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 8px 24px rgba(47,62,70,.07);text-decoration:none;color:var(--ink);min-height:104px}
a.tile:hover,a.card:hover,a.rw:hover{box-shadow:0 12px 36px rgba(47,62,70,.15)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.gh{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:20px 0 10px}
.bar{height:8px;border-radius:4px;background:#E0E9E6;overflow:hidden;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:var(--sage)}
.stack3{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.ic{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font:600 15px Inter,sans-serif;flex-shrink:0}
/* search */
.sbox{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;background:#fff;border-radius:24px;flex:1;min-width:200px;max-width:380px}
.sbox input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px}
/* rows */
a.rw,.rw{display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:14px 22px;min-height:68px;text-decoration:none;color:var(--ink);box-shadow:0 6px 24px rgba(47,62,70,.07)}
.rw.now{border:2px solid var(--sage);box-shadow:0 10px 32px rgba(94,139,126,.2)}
.rw.dash{background:rgba(255,255,255,.6);border:1.5px dashed #A8B5B1;box-shadow:none}
.num{width:40px;height:40px;border-radius:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font:600 16px Inter,sans-serif;border:2px solid #A8B5B1;color:var(--mute)}
.num.done{background:var(--sage);border-color:var(--sage);color:#fff}
.num.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:7px;background:#D5DEDB}
.dots i.on{background:var(--sage)}
/* vocab rows */
.vr{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid #EBF0EE;min-height:64px;flex-wrap:wrap}
.spk{width:44px;height:44px;border-radius:22px;background:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spk svg{width:20px;height:20px;fill:none;stroke:var(--sage-d);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vfr{font:600 18px Inter,sans-serif}
.phon{min-height:40px;padding:0 12px;border-radius:12px;background:#F1F5F4;color:var(--mute);font-size:14px;min-width:120px;text-align:left}
.phon.on{background:#FBE4E8;color:var(--ink)}
/* reading */
.rtext{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(24px,3.4vw,34px);line-height:1.7;white-space:pre-wrap}
.w{border-bottom:2px dotted var(--mute);cursor:pointer;border-radius:3px;padding:0 1px}
.w.saved{border-bottom:2px solid var(--sage)}
.w.sel{background:#F2C6CD;border-bottom:2px solid var(--ink)}
.pw{cursor:pointer;border-radius:3px}
.pw:hover{background:var(--pink-l)}
.gm{border-radius:4px;padding:0 2px;cursor:pointer}
.gm.sel{outline:2px solid var(--ink)}
.gk-verbs{background:#CFE3DC}.gk-nouns{background:#FBE9C6}.gk-adj{background:#E2D9F3}.gk-pron{background:#CFE0F3}.gk-sentence{background:#F6D9DE}.gk-prep{background:#D9EAD3}
.side{width:330px;flex-shrink:0}
.split{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.split>.grow{flex:1 1 420px}
.split>.side{flex:1 1 280px;max-width:100%}
#selbar{min-height:0}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.in{min-height:48px;padding:10px 14px;border:1.5px solid #D3DCD9;border-radius:16px;background:#F8FAF9;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
textarea.in{min-height:120px;resize:vertical;line-height:1.5}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:200px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(47,62,70,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px 20px;overflow:auto}
.modal{background:#fff;border-radius:28px;padding:24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(47,62,70,.3)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.cardbox{min-height:260px;border-radius:28px;background:#F1F5F4;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.big{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(34px,6vw,56px);line-height:1.15}
.pre{white-space:pre-wrap;line-height:1.7}
.rate{min-height:56px;border-radius:28px;font:600 16px Inter,sans-serif;flex:1;min-width:100px}
hr.l{border:0;border-top:1px solid #EBF0EE;margin:14px 0}
@media (max-width:640px){#app{padding:12px 14px calc(120px + env(safe-area-inset-bottom))}.card{padding:18px}.side{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>

      {id:'v2',lang:'fr',lesson:'l2',w:'fréquenter',pos:'v.',ipa:'/fʁe.kɑ̃.te/',phon:'',vi:'hay lui tới; giao du',en:'to frequent, to hang out at',ex:'Elle fréquente le même café que moi.',topic:'hằng ngày',forms:['fréquente','fréquenter'],verb:true,srs:null},
      {id:'v3',lang:'fr',lesson:'l2',w:'croiser',pos:'v.',ipa:'/kʁwa.ze/',phon:'cờ-roa-dê',vi:'tình cờ gặp',en:'to pass, to run into',ex:'Nous nous croisons souvent le matin.',topic:'hằng ngày',forms:['croisons','croiser'],verb:true,srs:null},
      {id:'v4',lang:'fr',lesson:'l2',w:'faire le premier pas',pos:'cụm',ipa:'',phon:'',vi:'chủ động làm quen / bắt chuyện trước',en:'to make the first move',ex:"C'est elle qui a fait le premier pas.",topic:'quan hệ',forms:['premier pas'],verb:false,srs:null},
      {id:'v5',lang:'fr',lesson:'l2',w:'un copain',pos:'n.m.',ipa:'/kɔ.pɛ̃/',phon:'cô-panh',vi:'bạn; bạn trai',en:'friend; boyfriend',ex:"Un livre que mon copain m'a offert.",topic:'quan hệ',forms:['copain'],verb:false,srs:null},
      {id:'v6',lang:'fr',lesson:'l2',w:'drôle',pos:'adj.',ipa:'/dʁol/',phon:'đờ-rôl',vi:'vui tính, hài hước',en:'funny',ex:'Claire est drôle.',topic:'tính cách',forms:['drôle'],verb:false,srs:null},
      {id:'v7',lang:'fr',lesson:'l2',w:'généreux, généreuse',pos:'adj.',ipa:'/ʒe.ne.ʁø/',phon:'',vi:'hào phóng',en:'generous',ex:'Elle est généreuse.',topic:'tính cách',forms:['généreuse','généreux'],verb:false,srs:null},
      {id:'v8',lang:'fr',lesson:'l2',w:'modeste',pos:'adj.',ipa:'/mɔ.dɛst/',phon:'mô-đét',vi:'khiêm tốn',en:'modest',ex:'Elle est modeste.',topic:'tính cách',forms:['modeste'],verb:false,srs:null},
      {id:'v9',lang:'fr',lesson:'l2',w:'de mauvaise humeur',pos:'cụm',ipa:'',phon:'',vi:'tâm trạng xấu, cáu kỉnh',en:'in a bad mood',ex:"Elle n'est jamais de mauvaise humeur.",topic:'cảm xúc',forms:['mauvaise humeur'],verb:false,srs:null},

    ],
    grammar:[
      {id:'g1',lang:'fr',lesson:'l2',group:'pron',name:'Pronoms relatifs qui / que',formula:'qui = chủ ngữ (+ động từ) · que = tân ngữ trực tiếp (+ chủ ngữ + động từ)',book:'Mẫu — thay bằng trang sách thực tế',

        deep:"• qui thay thế CHỦ NGỮ của mệnh đề phụ: đứng ngay trước động từ.\n• que thay thế TÂN NGỮ TRỰC TIẾP: sau que thường là một chủ ngữ (je, tu, il, danh từ…).\n• que → qu' trước nguyên âm; qui không bao giờ rút gọn.",

        compare:"Phân biệt với « qu'est-ce que » (hỏi sự vật nói chung) và « lequel » (hỏi chọn trong một nhóm đã biết).",

      {id:'g3',lang:'fr',lesson:'l2',group:'sentence',name:'Adverbes de fréquence',formula:'souvent, toujours, parfois, rarement · ne … jamais (phủ định)',book:'Mẫu',
        examples:[{t:'Nous nous croisons souvent le matin.',vi:'Chúng tôi thường gặp nhau vào buổi sáng.'},{t:"Elle n'est jamais de mauvaise humeur.",vi:'Cô ấy không bao giờ cáu kỉnh.'}],
        deep:"Trạng từ tần suất thường đứng sau động từ chia. « ne … jamais » bao quanh động từ (ne trước, jamais sau); ở passé composé, jamais đứng giữa trợ động từ và quá khứ phân từ.",
        compare:"« jamais » mang nghĩa phủ định → cần « ne » trong văn viết; trong lời nói thân mật hay bỏ « ne ».",
        errors:"Sai: Elle jamais est drôle → Đúng: Elle n'est jamais drôle.",
        marks:['souvent','jamais'],srs:null},
      {id:'g4',lang:'fr',lesson:'l2',group:'verbs',name:'Passé composé (rappel)',formula:'avoir / être (hiện tại) + participe passé',book:'Mẫu',
        examples:[{t:"Elle m'a demandé quel livre je lisais.",vi:'Cô ấy hỏi tôi đang đọc sách gì.'},{t:'Elle a fait le premier pas.',vi:'Cô ấy đã chủ động trước.'}],
        deep:"Đa số động từ dùng « avoir ». Động từ chỉ chuyển động/biến đổi và động từ phản thân dùng « être » và quá khứ phân từ hợp giống/số với chủ ngữ.",

function stateOf(x){var s=x.srs;if(!s)return 'Mới';if(s.lapses>=2&&s.interval<7)return 'Hay sai';if(s.interval>=21)return 'Đã thuộc';return 'Đang học'}
function grade(x,g){
 if(!x.srs)x.srs={reps:0,interval:0,ease:2.5,due:0,lapses:0};
 var s=x.srs;
 if(g===0){s.lapses++;s.reps=0;s.interval=0;s.ease=Math.max(1.3,s.ease-.2);s.due=now()+10*6e4}
 else{
  if(s.reps===0)s.interval=[0,1,1,4][g];
  else if(s.reps===1)s.interval=[0,2,4,6][g];
  else s.interval=Math.max(1,Math.round(s.interval*(g===1?1.2:g===2?s.ease:s.ease*1.3)));
  if(g===1)s.ease=Math.max(1.3,s.ease-.15);

  s.reps++;s.due=now()+s.interval*DAY;
 }

function qparts(lang){
 var t=now(),d=S.log[today()]||{},due=[],nv=[],ng=[];
 S.vocab.forEach(function(x){if(lang&&x.lang!==lang)return;if(x.srs){if(x.srs.due<=t)due.push(x)}else nv.push(x)});
 S.grammar.forEach(function(x){if(lang&&x.lang!==lang)return;if(x.srs){if(x.srs.due<=t)due.push(x)}else ng.push(x)});
 due.sort(function(a,b){return a.srs.due-b.srs.due});
 var nw=[];(lang?[lang]:Object.keys(LANGS)).forEach(function(l){
  var cv=Math.max(0,S.set.capV-(d[l+'_v']||0)),cg=Math.max(0,S.set.capG-(d[l+'_g']||0));
  nw=nw.concat(nv.filter(function(x){return x.lang===l}).slice(0,cv),ng.filter(function(x){return x.lang===l}).slice(0,cg));
 });
 return {due:due,nw:nw};
}

/* reading */
function isLat(c){return !!c&&/\p{Script=Latin}/u.test(c)}
function findAll(text,f){
 var out=[],lo=text.toLowerCase(),q=f.toLowerCase(),i=0;if(!q)return out;
 while((i=lo.indexOf(q,i))>=0){var e=i+q.length;var bl=isLat(lo[i-1])&&isLat(q[0]),br=isLat(lo[e])&&isLat(q[q.length-1]);if(!bl&&!br)out.push([i,e]);i=e}
 return out;
}
function ranges(text,mode,lid,lang){

 if(mode!=='gram'){
  S.vocab.filter(function(v){return v.lang===lang}).forEach(function(v){(v.forms||[]).forEach(function(f){findAll(text,f).forEach(function(p){r.push({s:p[0],e:p[1],cls:'w saved',a:'data-act="vw" data-id="'+v.id+'"'})})})});
 }else{
  S.grammar.filter(function(g){return g.lesson===lid}).forEach(function(g){(g.marks||[]).forEach(function(m){var p=findAll(text,m)[0];if(p)r.push({s:p[0],e:p[1],cls:'gm gk-'+g.group,a:'data-act="gw" data-id="'+g.id+'"'})})});
 }
 r.sort(function(a,b){return a.s-b.s||(b.e-b.s)-(a.e-a.s)});
 var o=[],end=-1;r.forEach(function(x){if(x.s>=end){o.push(x);end=x.e}});return o;

}

 var v={id:'v'+uid(),lang:x?x.lang:L(),lesson:x?x.id:null,w:w,pos:d.get('pos')||'',ipa:d.get('ipa')||'',phon:d.get('phon')||'',vi:d.get('vi')||'',en:d.get('en')||'',ex:d.get('ex')||'',topic:'',forms:forms,verb:false,srs:null,added:'reading'};
 S.vocab.push(v);U.sel={type:'v',id:v.id};save();closeModal();render();toast('Đã thêm “'+w+'”');
}
/* selection bar */
var selT;
document.addEventListener('selectionchange',function(){clearTimeout(selT);selT=setTimeout(function(){
 var bar=document.getElementById('selbar');if(!bar)return;
 var s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount){bar.innerHTML='';return}
 var rt=document.getElementById('rtext');if(!rt||!rt.contains(s.anchorNode)||!rt.contains(s.focusNode)){bar.innerHTML='';return}
 var t=s.toString().replace(/\s+/g,' ').trim();if(!t||t.length>60){bar.innerHTML='';return}
 bar.innerHTML='<div class="row"><button class="btn pink sm" data-act="addword" data-t="'+esc(t)+'">+ Thêm “'+esc(t.length>28?t.slice(0,28)+'…':t)+'” vào từ vựng</button></div>';
},200)});

/* ---------- router / render ---------- */
var navDepth=0,goingBack=false,lastHash=null;
function render(){
 var h=(location.hash||'#/home').slice(2),parts=h.split('?')[0].split('/').map(function(s){try{return decodeURIComponent(s)}catch(e){return s}});
 var name=parts[0]||'home';
 var view=(V[name]||V.home)(parts);
 var app=document.getElementById('app');
 var y=window.scrollY;
 app.innerHTML=view.html+nav(view.nav||'home');
 var prevName=render._last;render._last=name+'/'+(parts[1]||'');
 if(prevName!==render._last)window.scrollTo(0,0);else window.scrollTo(0,y);
 document.title='Học đa ngôn ngữ';
 if(name==='read'&&view.rid&&false){}
}
function refreshVlist(){var el=document.getElementById('vlist');if(el)el.innerHTML=vlist(L())}
window.addEventListener('hashchange',function(){if(goingBack){goingBack=false;navDepth=Math.max(0,navDepth-1)}else navDepth++;closeModal();if(!/^#\/read\//.test(location.hash))U.sel=null;render()});
document.addEventListener('click',function(ev){
 if(ev.target.id==='ov'){closeModal();return}
 var el=ev.target.closest('[data-act]');if(!el||el.tagName==='FORM')return;
 var f=A[el.dataset.act];if(f){f(el,ev)}
});
document.addEventListener('submit',function(ev){
 var f=ev.target;
 if(f.id==='aw'){ev.preventDefault();submitAdd(f);return}
 if(f.dataset&&f.dataset.act==='khosearch'){A.khosearch(f,ev)}
});
document.addEventListener('input',function(ev){
 var t=ev.target;if(!t.dataset)return;
 if(t.dataset.in==='vq'){U.vf.q=t.value;U.deck.i=0;refreshVlist()}
});
document.addEventListener('change',function(ev){
 var t=ev.target;if(!t.dataset)return;
 if(t.dataset.in==='capV'){S.set.capV=Math.max(0,Math.min(50,+t.value||0));save();toast('Đã lưu')}
 if(t.dataset.in==='capG'){S.set.capG=Math.max(0,Math.min(10,+t.value||0));save();toast('Đã lưu')}
 if(t.dataset.in==='import'&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||!o.lessons||!o.vocab)throw 0;S=fix(o);R=null;save();toast('Đã nhập dữ liệu');location.hash='#/home';render()}catch(e){toast('File không đúng định dạng sao lưu')}};fr.readAsText(t.files[0])}
});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape')closeModal();
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.getAttribute&&ev.target.getAttribute('role')==='button'&&ev.target.dataset.act){ev.preventDefault();ev.target.click()}
});
if(!location.hash)location.hash='#/home';
render();
})();
</script>
