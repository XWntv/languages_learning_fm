<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học ngoại ngữ">
<meta name="theme-color" content="#F1F5F4">
<title>Học đa ngôn ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>:root{--bg:#F1F5F4;--ink:#2F3E46;--mute:#5B6B72;--sage:#5E8B7E;--sage-d:#3F6F62;--sage-l:#CFE3DC;--pink:#E8AEB7;--pink-l:#F6D9DE;--sky:#A7C7E7;--sky-l:#CFE0F3;--line:#E4EDEA;--card:#FFFFFF;--shadow:0 8px 30px rgba(47,62,70,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--sage-d)}
h1,h2,h3,h4{margin:0;font-family:Inter,sans-serif}
p{margin:0}
#app{max-width:1100px;margin:0 auto;padding:14px 20px calc(120px + env(safe-area-inset-bottom))}
.disp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(32px,5vw,44px);line-height:1.1}
.mute{color:var(--mute)}
.sm{font-size:13px}
.b{font-weight:600}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:14px}
/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.back{min-height:44px;padding:0 16px;border-radius:22px;background:#fff;font:600 14px Inter,sans-serif;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);box-shadow:0 4px 16px rgba(47,62,70,.06)}
.crumbs{font-size:14px;color:var(--mute);flex:1;min-width:120px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--sage-d);font-weight:500;text-decoration:none}
.crumbs i{font-style:normal}
.langs{display:flex;gap:4px;padding:4px;background:#fff;border-radius:24px;box-shadow:0 4px 16px rgba(47,62,70,.08)}
.lg{min-height:40px;min-width:46px;border-radius:20px;font:600 14px Inter,sans-serif;color:var(--mute)}
.lg.on{background:var(--sage);color:#fff}
.plus{position:relative;width:44px;height:44px;border-radius:22px;background:var(--pink);display:inline-flex;align-items:center;justify-content:center;font:600 22px Inter,sans-serif;color:var(--ink);text-decoration:none}
.plus b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
/* nav */
.nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:36px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 32px rgba(47,62,70,.14);z-index:20}
.ni{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:clamp(72px,20vw,96px);height:60px;border-radius:28px;text-decoration:none;font-size:12px;font-weight:500;color:var(--mute)}
.ni.on{background:var(--line);color:var(--ink)}
.ni.on svg{stroke:var(--sage-d)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ni em{position:absolute;top:4px;right:14px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:var(--ink);font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* buttons */
.btn{min-height:48px;padding:0 24px;border-radius:24px;background:var(--ink);color:#fff;font:600 15px Inter,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:hover{background:#3F5058}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(47,62,70,.06)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid #A8B5B1}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.lg2{min-height:56px;font-size:17px;padding:0 32px;border-radius:28px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{min-height:44px;padding:0 18px;border-radius:22px;background:#fff;font:600 14px Inter,sans-serif;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(47,62,70,.05)}
.chip.on{background:var(--sage);color:#fff}
.chip.dark.on{background:var(--ink)}
.seg{display:inline-flex;gap:4px;padding:5px;background:#fff;border-radius:28px;box-shadow:0 4px 16px rgba(47,62,70,.06);flex-wrap:wrap}
.seg button{min-height:44px;padding:0 20px;border-radius:22px;font:600 15px Inter,sans-serif}
.seg button.on{background:var(--sage);color:#fff}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#EBF0EE;display:inline-flex;align-items:center}
.tag.sage{background:var(--sage-l)}
.tag.sky{background:var(--sky-l)}
.tag.pink{background:var(--pink-l)}
.tag.warn{background:#FFF1D6}
/* cards */
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.card.dark{background:var(--ink);color:#fff}
.card.dark .mute{color:#B9C8C3}
.card.soft{background:#F8FAF9;box-shadow:none;border:1.5px dashed #A8B5B1}
.tile{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 8px 24px rgba(47,62,70,.07);text-decoration:none;color:var(--ink);min-height:104px}
a.tile:hover,a.card:hover,a.rw:hover{box-shadow:0 12px 36px rgba(47,62,70,.15)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.gh{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:20px 0 10px}
.bar{height:8px;border-radius:4px;background:#E0E9E6;overflow:hidden;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:var(--sage)}
.stack3{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.ic{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font:600 15px Inter,sans-serif;flex-shrink:0}
/* search */
.sbox{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;background:#fff;border-radius:24px;flex:1;min-width:200px;max-width:380px}
.sbox input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px}
/* rows */
a.rw,.rw{display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:14px 22px;min-height:68px;text-decoration:none;color:var(--ink);box-shadow:0 6px 24px rgba(47,62,70,.07)}
.rw.now{border:2px solid var(--sage);box-shadow:0 10px 32px rgba(94,139,126,.2)}
.rw.dash{background:rgba(255,255,255,.6);border:1.5px dashed #A8B5B1;box-shadow:none}
.num{width:40px;height:40px;border-radius:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font:600 16px Inter,sans-serif;border:2px solid #A8B5B1;color:var(--mute)}
.num.done{background:var(--sage);border-color:var(--sage);color:#fff}
.num.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:7px;background:#D5DEDB}
.dots i.on{background:var(--sage)}
/* vocab rows */
.vr{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid #EBF0EE;min-height:64px;flex-wrap:wrap}
.spk{width:44px;height:44px;border-radius:22px;background:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spk svg{width:20px;height:20px;fill:none;stroke:var(--sage-d);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vfr{font:600 18px Inter,sans-serif}
.phon{min-height:40px;padding:0 12px;border-radius:12px;background:#F1F5F4;color:var(--mute);font-size:14px;min-width:120px;text-align:left}
.phon.on{background:#FBE4E8;color:var(--ink)}
/* reading */
.rtext{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(24px,3.4vw,34px);line-height:1.7;white-space:pre-wrap}
.w{border-bottom:2px dotted var(--mute);cursor:pointer;border-radius:3px;padding:0 1px}
.w.saved{border-bottom:2px solid var(--sage)}
.w.sel{background:#F2C6CD;border-bottom:2px solid var(--ink)}
.pw{cursor:pointer;border-radius:3px}
.pw:hover{background:var(--pink-l)}
.gm{border-radius:4px;padding:0 2px;cursor:pointer}
.gm.sel{outline:2px solid var(--ink)}
.gk-verbs{background:#CFE3DC}.gk-nouns{background:#FBE9C6}.gk-adj{background:#E2D9F3}.gk-pron{background:#CFE0F3}.gk-sentence{background:#F6D9DE}.gk-prep{background:#D9EAD3}
.side{width:330px;flex-shrink:0}
.split{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.split>.grow{flex:1 1 420px}
.split>.side{flex:1 1 280px;max-width:100%}
#selbar{min-height:0}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.in{min-height:48px;padding:10px 14px;border:1.5px solid #D3DCD9;border-radius:16px;background:#F8FAF9;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
textarea.in{min-height:120px;resize:vertical;line-height:1.5}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:200px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(47,62,70,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px 20px;overflow:auto}
.modal{background:#fff;border-radius:28px;padding:24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(47,62,70,.3)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.cardbox{min-height:260px;border-radius:28px;background:#F1F5F4;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.big{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(34px,6vw,56px);line-height:1.15}
.pre{white-space:pre-wrap;line-height:1.7}
.rate{min-height:56px;border-radius:28px;font:600 16px Inter,sans-serif;flex:1;min-width:100px}
hr.l{border:0;border-top:1px solid #EBF0EE;margin:14px 0}
@media (max-width:640px){#app{padding:12px 14px calc(120px + env(safe-area-inset-bottom))}.card{padding:18px}.side{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

[hidden]{display:none!important}

a.chip{text-decoration:none;color:var(--ink)}
a.chip:hover{background:var(--sage-l)}

.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

.sbox svg,.ic svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sbox svg{color:var(--mute)}

.ul{margin:6px 0 0;padding-left:20px;line-height:1.75}
.num.cur{background:var(--ink);border-color:var(--ink);color:#fff}

.card .seg button{padding:0 14px;font-size:14px}
</style>
</head>

        deep:"« quel » hỏi về loại/lựa chọn và luôn đi với danh từ; nó phải hợp giống và số với danh từ đó.",
        compare:"Phân biệt với « qu'est-ce que » (hỏi sự vật nói chung) và « lequel » (hỏi chọn trong một nhóm đã biết).",

      {id:'g3',lang:'fr',lesson:'l2',group:'adj',name:'Adverbes de fréquence',formula:'souvent, toujours, parfois, rarement · ne … jamais (phủ định)',book:'Mẫu',
        examples:[{t:'Nous nous croisons souvent le matin.',vi:'Chúng tôi thường gặp nhau vào buổi sáng.'},{t:"Elle n'est jamais de mauvaise humeur.",vi:'Cô ấy không bao giờ cáu kỉnh.'}],
        deep:"Trạng từ tần suất thường đứng sau động từ chia. « ne … jamais » bao quanh động từ (ne trước, jamais sau); ở passé composé, jamais đứng giữa trợ động từ và quá khứ phân từ.",
        compare:"« jamais » mang nghĩa phủ định → cần « ne » trong văn viết; trong lời nói thân mật hay bỏ « ne ».",
        errors:"Sai: Elle jamais est drôle → Đúng: Elle n'est jamais drôle.",
        marks:['souvent','jamais'],srs:null},
      {id:'g4',lang:'fr',lesson:'l2',group:'verbs',name:'Passé composé (rappel)',formula:'avoir / être (hiện tại) + participe passé',book:'Mẫu',
        examples:[{t:"Elle m'a demandé quel livre je lisais.",vi:'Cô ấy hỏi tôi đang đọc sách gì.'},{t:'Elle a fait le premier pas.',vi:'Cô ấy đã chủ động trước.'}],
        deep:"Đa số động từ dùng « avoir ». Động từ chỉ chuyển động/biến đổi và động từ phản thân dùng « être » và quá khứ phân từ hợp giống/số với chủ ngữ.",
        compare:"Passé composé (hành động đã xong) ≠ imparfait (bối cảnh/thói quen): « elle m'a demandé quel livre je lisais » dùng cả hai.",
        errors:"Sai: Elle a allé → Đúng: Elle est allée.",
        marks:['a fait',"a demandé"],srs:null},
      {id:'g5',lang:'fr',lesson:'l2',group:'adj',name:"Féminin des adjectifs",formula:'+ e · -eux → -euse · -e giữ nguyên',book:'Mẫu',
        examples:[{t:'Claire est généreuse.',vi:'Claire hào phóng.'},{t:'Elle est drôle et modeste.',vi:'Cô ấy vui tính và khiêm tốn.'}],
        deep:"Tính từ tận cùng bằng -e không đổi ở giống cái (drôle, modeste). -eux → -euse (généreux → généreuse).",
        compare:"",errors:"",

        examples:[{t:'Je lui ai montré un livre.',vi:'Tôi đã cho cô ấy xem một cuốn sách.'}],
        deep:"« lui » thay thế « à + người » (tân ngữ gián tiếp), chung cho nam và nữ. Ở passé composé, « lui » đứng trước trợ động từ.",
        compare:"« lui » (COI, người) ≠ « le/la » (COD).",errors:"Sai: J'ai lui montré → Đúng: Je lui ai montré.",
        marks:['lui ai montré'],srs:null}
    ],
    drills:[
      {id:'d1',lang:'fr',lesson:'l2',g:'Pronoms relatifs qui / que',q:'Le livre ___ je lis est passionnant.',a:'que',why:"« je lis » có chủ ngữ riêng → « que » làm tân ngữ trực tiếp của « lis »."},
      {id:'d2',lang:'fr',lesson:'l2',g:'Pronoms relatifs qui / que',q:'La voisine ___ habite au troisième est drôle.',a:'qui',why:"Sau chỗ trống là động từ « habite » → « qui » làm chủ ngữ."},
      {id:'d3',lang:'fr',lesson:'l2',g:'Pronoms relatifs qui / que',q:"C'est elle ___ a fait le premier pas.",a:'qui',why:"« a fait » là động từ, chỗ trống làm chủ ngữ → « qui »."},
      {id:'d4',lang:'fr',lesson:'l2',g:'Pronoms relatifs qui / que',q:'Le café ___ elle fréquente est petit.',a:'que',why:"Sau chỗ trống là chủ ngữ « elle » → « que »."}
    ],

      {id:'n1',lang:'fr',lesson:'l2',type:'pron',title:'Ghi chú mẫu: liaison (chưa kiểm chứng)',body:'Đây là ví dụ cho mục Phát âm. Hãy hỏi Claude về phát âm rồi dán kết quả vào trang Thêm.\nPhiên âm IPA và phiên âm tiếng Việt do AI viết nên cần đối chiếu với từ điển/audio.'}
    ],

<script>(function(){
'use strict';
var KEY='whp.v1',DAY=864e5,now=function(){return Date.now()};
var LANGS={fr:{n:'Pháp',full:'Tiếng Pháp',tts:'fr-FR'},zh:{n:'Trung',full:'Tiếng Trung',tts:'zh-CN'},en:{n:'Anh',full:'Tiếng Anh',tts:'en-GB'}};

var ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

 rev:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
 kho:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 spk:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
function svg(k,s){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(s?' width="'+s+'" height="'+s+'"':'')+'>'+ICON[k]+'</svg>'}

/* ---------- state ---------- */
var S;
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.lessons)return o}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fix(o){var d=SEED();for(var k in d){if(o[k]===undefined)o[k]=d[k]}for(var k2 in d.set){if(o.set[k2]===undefined)o.set[k2]=d.set[k2]}if(!o.ui.lang)o.ui.lang='fr';if(!o.kinds)o.kinds={};if(!o.views)o.views=[{id:'vw1',name:'Từ hay sai',lang:'fr',f:{state:'Hay sai'}},{id:'vw2',name:'Danh từ',lang:'fr',f:{pos:'Danh từ'}}];['vocab','grammar'].forEach(function(k){(o[k]||[]).forEach(function(x){if(x.inReview===undefined)x.inReview=!!x.srs})});return o}
S=fix(load()||SEED());
var U={gtab:0,gsel:null,addType:'book',pasteDraft:'',vf:{lesson:'all',state:'all',q:'',view:'list'},deck:{i:0,flip:false},sel:null,rd:'read',rev:{},tr:false,gf:'all'};
var R=null; // review session
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function L(){return S.ui.lang}
function lessonsOf(l){return S.lessons.filter(function(x){return x.lang===l})}
function lesson(id){return S.lessons.find(function(x){return x.id===id})}
function lname(id){var l=lesson(id);return l?(l.name+(l.title?' · '+l.title:'')):'(chưa gắn bài)'}
function penBtn(id){return '<button class="spk" data-act="editfull" data-id="'+id+'" aria-label="Sửa" title="Sửa">'+svg('pen')+'</button>'}
function dmy(d){var a=String(d||'').split('-');return a.length===3?a[2]+'/'+a[1]:d}
function noteBox(x){return x.note?'<div class="card soft" style="margin-top:12px"><div class="gh" style="margin-bottom:4px">Ghi chú của tôi</div><p class="pre">'+esc(x.note)+'</p></div>':''}
function isV(x){return 'w' in x}
function find(id){return S.vocab.find(function(x){return x.id===id})||S.grammar.find(function(x){return x.id===id})}
function prog(lid,k){S.prog[lid]=S.prog[lid]||{};if(!S.prog[lid][k]){S.prog[lid][k]=1;save()}}

/* ---------- SRS ---------- */
function stateOf(x){var s=x.srs;if(!s)return 'Mới';if(s.lapses>=2&&s.interval<7)return 'Hay sai';if(s.interval>=21)return 'Đã thuộc';return 'Đang học'}
function grade(x,g){
 if(!x.srs)x.srs={reps:0,interval:0,ease:2.5,due:0,lapses:0};
 var s=x.srs;
 if(g===0){s.lapses++;s.reps=0;s.interval=0;s.ease=Math.max(1.3,s.ease-.2);s.due=now()+10*6e4}
 else{
  if(s.reps===0)s.interval=[0,1,1,4][g];
  else if(s.reps===1)s.interval=[0,2,4,6][g];
  else s.interval=Math.max(1,Math.round(s.interval*(g===1?1.2:g===2?s.ease:s.ease*1.3)));
  if(g===1)s.ease=Math.max(1.3,s.ease-.15);
  if(g===3)s.ease+=.15;
  s.reps++;s.due=now()+s.interval*DAY;
 }
}
function qparts(lang){
 var t=now(),d=S.log[today()]||{},due=[],nv=[],ng=[];
 S.vocab.forEach(function(x){if(lang&&x.lang!==lang)return;if(x.srs){if(x.srs.due<=t)due.push(x)}else if(x.inReview)nv.push(x)});
 S.grammar.forEach(function(x){if(lang&&x.lang!==lang)return;if(x.srs){if(x.srs.due<=t)due.push(x)}else if(x.inReview)ng.push(x)});
 due.sort(function(a,b){return a.srs.due-b.srs.due});
 var nw=[];(lang?[lang]:Object.keys(LANGS)).forEach(function(l){
  var cv=Math.max(0,S.set.capV-(d[l+'_v']||0)),cg=Math.max(0,S.set.capG-(d[l+'_g']||0));
  nw=nw.concat(nv.filter(function(x){return x.lang===l}).slice(0,cv),ng.filter(function(x){return x.lang===l}).slice(0,cg));
 });
 return {due:due,nw:nw};
}
function counts(lang){var q=qparts(lang);return {due:q.due.length,nw:q.nw.length,total:q.due.length+q.nw.length}}

/* ---------- speech ---------- */
var VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis&&speechSynthesis.getVoices())||[]}catch(e){VOICES=[]}return VOICES}
function vlang(v){return String(v.lang||'').replace('_','-')}
function voicesFor(lang){var pre=(LANGS[lang]||LANGS.fr).tts.slice(0,2).toLowerCase();return loadVoices().filter(function(v){return vlang(v).toLowerCase().indexOf(pre)===0})}
function voiceScore(v,lang){var n=(v.name||'').toLowerCase(),sc=0,t=(LANGS[lang]||LANGS.fr).tts.toLowerCase();if(vlang(v).toLowerCase()===t)sc+=5;if(/premium|enhanced|nâng cao|cao cấp|siri/.test(n))sc+=4;if(/am[eé]lie|thomas|audrey|ting|mei-jia|tingting|daniel|kate|serena|oliver/.test(n))sc+=2;if(v.localService)sc+=1;return sc}
function pickVoice(lang){var vs=voicesFor(lang);if(!vs.length)return null;var sel=S.set.voice&&S.set.voice[lang];var f=sel&&vs.find(function(v){return v.voiceURI===sel});if(f)return f;return vs.slice().sort(function(a,b){return voiceScore(b,lang)-voiceScore(a,lang)})[0]}
var warnedV={};
function mkUtt(text,lang,rate){var u=new SpeechSynthesisUtterance(text),v=pickVoice(lang);u.lang=v?vlang(v):(LANGS[lang]||LANGS.fr).tts;if(v)u.voice=v;else if(!warnedV[lang]){warnedV[lang]=1;toast('Máy chưa có giọng '+(LANGS[lang]||LANGS.fr).full.toLowerCase()+': nghe sẽ sai âm. Xem Cài đặt › Giọng đọc')}u.rate=rate||S.set.rate||.9;return u}
function speak(text,lang,rate){
 try{if(!window.speechSynthesis)return toast('Thiết bị chưa hỗ trợ phát âm');
  speechSynthesis.cancel();speechSynthesis.speak(mkUtt(text,lang,rate))}catch(e){}
}
try{if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=function(){loadVoices();if(/^#\/settings/.test(location.hash)&&window.render)render()}}}catch(e){}
function nativeLinks(v){var w=encodeURIComponent(String(v.w).replace(/^(un|une|le|la|l'|les)\s*/i,'').split(/[ ,(]/)[0]||v.w),m={fr:['fr','french'],zh:['zh','chinese'],en:['en','english']}[v.lang]||['fr','french'];return '<p class="mute sm" style="margin-top:8px">Nghe người bản xứ (chưa kiểm tra liên kết): <a target="_blank" rel="noopener" href="https://forvo.com/word/'+w+'/#'+m[0]+'">Forvo ↗</a> · <a target="_blank" rel="noopener" href="https://youglish.com/pronounce/'+w+'/'+m[1]+'">YouGlish ↗</a></p>'}

/* ---------- ui helpers ---------- */
var tt;
function toast(m){var o=document.getElementById('toast');if(!o){o=document.createElement('div');o.id='toast';o.className='toast';o.setAttribute('role','status');document.body.appendChild(o)}o.textContent=m;o.hidden=false;clearTimeout(tt);tt=setTimeout(function(){o.hidden=true},2600)}

  (isHome?'':'<button class="back" data-act="back" aria-label="Quay lại trang trước">‹ Quay lại</button><a class="back" href="#/home" aria-label="Về trang chủ">⌂ Trang chủ</a>')+

/* ---------- views ---------- */
var V={};

function qkinds(lang){var q=qparts(lang),v=0,g=0,e=0;q.due.concat(q.nw).forEach(function(x){if(isErr(x))e++;else if(isV(x))v++;else g++});return {v:v,g:g,e:e}}
function overdue(lang){var t0=new Date();t0.setHours(0,0,0,0);var t=t0.getTime();return S.vocab.concat(S.grammar).filter(function(x){return (!lang||x.lang===lang)&&x.srs&&x.srs.due<t}).length}

function contRow(x){
 if(!x)return '';var n=nextStep(x.id),tot=stepList(x.id).length,dn=stepsDone(x.id);
 return '<a class="rw now" href="'+(n?stepHref(n[0],x.id):'#/lesson/'+x.id)+'"><div class="num cur">▶</div><div class="grow"><div class="b">Tiếp tục: '+esc(x.name)+(x.title?' · '+esc(x.title):'')+'</div><div class="mute sm">'+esc(x.book)+' · '+esc(x.unit)+' · '+(n?'Bước '+(stepList(x.id).indexOf(n)+1)+': '+n[1]:'Đã xong các bước')+' · '+dn+'/'+tot+' bước xong</div></div><span>›</span></a>';
}
V.home=function(){
 var all=counts(null),tot=Object.keys(LANGS).reduce(function(a,k){return a+budget(k)},0),used=Object.keys(LANGS).reduce(function(a,k){return a+usedMin(k)},0);
 var due=Object.keys(LANGS).filter(function(k){return counts(k).total}).map(function(k){return LANGS[k].n}).join(', ');
 var cards=Object.keys(LANGS).map(function(k){
  var c=counts(k),x=lastOf(k),n=x&&nextStep(x.id);
  if(!x)return '<div class="tile"><div class="row sp"><div class="ic" style="background:var(--sage-l)">'+LANGS[k].n.slice(0,2)+'</div></div><h3 style="margin-top:6px">'+LANGS[k].full+'</h3><p class="mute sm">Chưa có bài nào</p><a class="btn pink sm" href="#/add" style="align-self:flex-start;margin-top:6px" data-act="setlang" data-l="'+k+'">Thêm bài đầu tiên</a></div>';
  return '<a class="tile" href="#/lang/'+k+'"><div class="row sp"><div class="ic" style="background:var(--sage-l)">'+LANGS[k].n.slice(0,2)+'</div>'+(c.total?'<span class="tag pink">'+c.total+' thẻ cần ôn</span>':'<span class="tag sage">Xong</span>')+'</div><h3 style="margin-top:6px">'+LANGS[k].full+'</h3><p class="mute sm">'+esc(x.book)+' · '+esc(x.unit)+'</p><p class="sm"><b>Đang học</b> · '+esc(x.name)+(n?' · Bước '+(stepList(x.id).indexOf(n)+1)+': '+n[1]:'')+'</p><span class="btn sage sm" style="align-self:flex-start;margin-top:6px">Vào trang '+LANGS[k].full.toLowerCase()+'</span></a>';
 }).join('');
 return {nav:'home',html:topbar([],true).replace('<a class="plus"','<a class="back" href="#/settings" style="margin-left:auto">⚙ Cài đặt</a><a class="plus"')+
  backupBanner()+'<p class="mute sm">'+dayName()+'</p><div class="row sp"><h1 class="disp">Hôm nay học gì?</h1><a class="btn pink" href="#/add">+ Thêm bài mới</a></div>'+

function lines(t){return String(t||'').split('\n').map(function(a){return a.trim()}).filter(Boolean)}
function exToText(a){return (a||[]).map(function(e){return e.t+(e.vi?' | '+e.vi:'')}).join('\n')}
function textToEx(t){return lines(t).map(function(l){var i=l.indexOf('|');return i<0?{t:l,vi:''}:{t:l.slice(0,i).trim(),vi:l.slice(i+1).trim()}})}
function tblToText(a){return (a||[]).map(function(t){return '# '+(t.title||'')+'\n'+(t.rows||[]).map(function(r){return r[0]+' | '+r[1]}).join('\n')}).join('\n')}
function textToTbl(t){var out=[],cur=null;lines(t).forEach(function(l){if(l[0]==='#'){cur={title:l.slice(1).trim(),rows:[]};out.push(cur)}else{if(!cur){cur={title:'',rows:[]};out.push(cur)}var i=l.indexOf('|');cur.rows.push(i<0?[l,'']:[l.slice(0,i).trim(),l.slice(i+1).trim()])}});return out}

document.addEventListener('click',function(ev){
 if(ev.target.id==='ov'){closeModal();return}
 var el=ev.target.closest('[data-act]');if(!el||el.tagName==='FORM')return;
 var f=A[el.dataset.act];if(f){f(el,ev)}
});
document.addEventListener('submit',function(ev){
 var f=ev.target;
 if(f.id==='ef'){ev.preventDefault();saveFull(f);return}
 if(f.id==='aw'){ev.preventDefault();submitAdd(f);return}
 if(f.id==='pl'){ev.preventDefault();return}
 if(f.id==='ec'){ev.preventDefault();var xc=find(f.dataset.id),dd=new FormData(f);dd.forEach(function(v,k){xc[k]=String(v).trim()});if(isV(xc)&&xc.w&&(xc.forms||[]).indexOf(xc.w)<0)xc.forms=(xc.forms||[]).concat([xc.w]);save();closeModal();render();return}
 if(f.id==='sv'){ev.preventDefault();var nm=String(new FormData(f).get('n')||'').trim();if(!nm)return;S.views=S.views||[];S.views.push({id:'vw'+uid(),name:nm,lang:L(),f:{lesson:U.vf.lesson,state:U.vf.state,q:U.vf.q,topic:U.vf.topic,pos:U.vf.pos,inrev:U.vf.inrev}});save();closeModal();toast('Đã lưu chế độ xem “'+nm+'”');return}
 if(f.dataset&&f.dataset.act==='homesearch'){ev.preventDefault();location.hash='#/search?q='+encodeURIComponent(document.getElementById('hs').value);return}
 if(f.id==='pl2'){ev.preventDefault();var it=S.inbox.find(function(x){return x.id===f.dataset.id}),pl=readPlace(f,it.pkg.lang);if(pl.book)it.pkg.lesson=Object.assign({},it.pkg.lesson||{},{lang:it.pkg.lang,book:pl.book,unit:pl.unit,no:pl.no,name:pl.name});else it.pkg.lesson=null;save();closeModal();render();return}
 if(f.id==='eb'){ev.preventDefault();var l=L(),o=f.dataset.b,n=canon(new FormData(f).get('n'),bookList(l).filter(function(b){return b!==o}));S.lessons.forEach(function(x){if(x.lang===l&&x.book===o)x.book=n});delete S.kinds[l+'|'+o];S.kinds[l+'|'+n]=new FormData(f).get('k');save();closeModal();render();return}
 if(f.id==='eu'){ev.preventDefault();var l2=L(),b=f.dataset.b,u=f.dataset.u,nn=canon(new FormData(f).get('n'),unitList(l2,b).filter(function(q){return q!==u}));S.lessons.forEach(function(x){if(x.lang===l2&&x.book===b&&x.unit===u)x.unit=nn});save();closeModal();location.hash='#/books/'+E(b)+'/'+E(nn);render();return}
 if(f.id==='el'){ev.preventDefault();var x=lesson(f.dataset.id),pl3=readPlace(f,x.lang);if(!pl3.book)return toast('Hãy chọn hoặc nhập tên sách');x.book=pl3.book;x.unit=pl3.unit;x.no=pl3.no||x.no;x.name=pl3.name||((x.lang==='fr'?'Leçon ':'Bài ')+x.no);x.title=String(new FormData(f).get('title')||'').trim();save();closeModal();location.hash='#/books/'+E(x.book)+'/'+E(x.unit);render();return}
 if(f.dataset&&f.dataset.act==='khosearch'){A.khosearch(f,ev)}
});
document.addEventListener('input',function(ev){
 var t=ev.target;if(!t.dataset)return;
 if(t.dataset.in==='paste'){U.pasteDraft=t.value}
 if(t.dataset.in==='rate'){A.rate(t)}
 if(t.dataset.in==='vq'){U.vf.q=t.value;U.deck.i=0;refreshVlist()}
});
document.addEventListener('change',function(ev){
 var t=ev.target;if(!t.dataset)return;
 if(t.dataset.act==='setvoice'){A.setvoice(t);toast('Đã chọn giọng')}
 if(t.dataset.in==='bookSel'){var bn=document.getElementById('bnw');if(bn)bn.hidden=t.value!=='__new'}
 if(t.dataset.in&&t.dataset.in.indexOf('bud-')===0){S.set.budget=S.set.budget||{};S.set.budget[t.dataset.in.slice(4)]=Math.max(0,Math.min(240,+t.value||0));save();toast('Đã lưu')}
 if(t.dataset.in==='capV'){S.set.capV=Math.max(0,Math.min(50,+t.value||0));save();toast('Đã lưu')}
 if(t.dataset.in==='capG'){S.set.capG=Math.max(0,Math.min(10,+t.value||0));save();toast('Đã lưu')}
 if(t.dataset.in==='import'&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||!o.lessons||!o.vocab)throw 0;S=fix(o);R=null;save();toast('Đã nhập dữ liệu');location.hash='#/home';render()}catch(e){toast('File không đúng định dạng sao lưu')}};fr.readAsText(t.files[0])}
});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape')closeModal();
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.getAttribute&&ev.target.getAttribute('role')==='button'&&ev.target.dataset.act){ev.preventDefault();ev.target.click()}
});
if(!location.hash)location.hash='#/home';
render();
})();
</script>
</body>
</html>
